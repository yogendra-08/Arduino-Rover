<text x="60" y="428" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328">Must-do checklist</text>
<text x="60" y="452" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">• Remove the ENA and ENB jumper caps on the L298N.</text>
<text x="60" y="471" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">• Keep the L298N 5V-EN jumper ON; leave its 5V</text>
<text x="60" y="490" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">   terminal unconnected (Arduino has its own supply).</text>
<text x="60" y="509" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">• HC-05 RXD must go through the 1 kΩ / 2 kΩ divider.</text>
<text x="60" y="528" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">• Battery −, L298N GND, Arduino GND, HC-05 GND</text>
<text x="60" y="547" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">   are all joined (common ground).</text>
<text x="60" y="566" text-anchor="start" font-size="13" font-weight="400" fill="#1f2328">• Switch the battery OFF before wiring or uploading.</text>
<rect x="440" y="470" width="190" height="130" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="455" y="492" text-anchor="start" font-size="14" font-weight="700" fill="#1f2328">Legend</text>
<line x1="455" y1="510" x2="490" y2="510" stroke="#1f6feb" stroke-width="4"/>
<text x="500" y="514" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">Signal</text>
<line x1="455" y1="527" x2="490" y2="527" stroke="#d1242f" stroke-width="4"/>
<text x="500" y="531" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">5 V</text>
<line x1="455" y1="544" x2="490" y2="544" stroke="#24292f" stroke-width="4"/>
<text x="500" y="548" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">Ground</text>
<line x1="455" y1="561" x2="490" y2="561" stroke="#e36209" stroke-width="4"/>
<text x="500" y="565" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">Battery +</text>
<line x1="455" y1="578" x2="490" y2="578" stroke="#8250df" stroke-width="4"/>
<text x="500" y="582" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">Motor leads</text>
<text x="1305" y="555" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">Both motors on a side share one</text>
<text x="1305" y="572" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">L298N channel (same OUT pair).</text>
<text x="1305" y="589" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">If a side spins backwards, swap</text>
<text x="1305" y="606" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">its two wires at OUT terminals.</text>
<text x="710.0" y="696" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">Schematic layout: module pin positions on real boards differ. L298N header order is ENA IN1 IN2 IN3 IN4 ENB.  Not yet tested on hardware.</text>
</svg>